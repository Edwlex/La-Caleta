<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin • La Caleta D'Charly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen p-4 sm:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-stone-800 pb-4">
      <h1 class="text-2xl font-extrabold text-amber-400">⚙️ Panel del Menú</h1>
      <a href="index.html" class="text-sm text-stone-400 hover:text-white">← Volver a la web</a>
    </header>

    <p class="text-sm text-stone-400">Marca qué platos hay <strong>hoy</strong> y edita precios. Cambia de día para llenar toda la semana.</p>

    <!-- Selector de día -->
    <div class="flex flex-wrap gap-2" id="dias"></div>

    <!-- Precio del día -->
    <div class="bg-[#0b1c27] border border-stone-800 rounded-2xl p-5 flex items-center justify-between">
      <label class="font-bold text-white">Precio del menú del día</label>
      <input id="precio-dia" type="number" step="0.5" class="w-28 bg-[#06121a] border border-stone-700 rounded-xl px-3 py-2 text-white text-right" />
    </div>

    <!-- Entradas -->
    <div class="bg-[#0b1c27] border border-stone-800 rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between"><h3 class="font-bold text-white">Entradas</h3>
        <button onclick="agregarPlato('entradas')" class="bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar</button></div>
      <div id="lista-entradas" class="space-y-2"></div>
    </div>

    <!-- Segundos -->
    <div class="bg-[#0b1c27] border border-stone-800 rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between"><h3 class="font-bold text-white">Segundos</h3>
        <button onclick="agregarPlato('segundos')" class="bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Agregar</button></div>
      <div id="lista-segundos" class="space-y-2"></div>
    </div>

    <!-- Activar/desactivar día -->
    <label class="flex items-center gap-3 bg-[#0b1c27] border border-stone-800 rounded-2xl p-5 cursor-pointer">
      <input id="dia-activo" type="checkbox" class="w-5 h-5 accent-orange-600" />
      <span class="font-bold text-white">Este día SÍ tiene menú del día (si lo desmarcas, la web mostrará "cerrado")</span>
    </label>

    <!-- Guardar -->
    <div class="flex flex-wrap gap-3">
      <button onclick="guardar()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-6 py-3 rounded-xl">💾 Guardar cambios</button>
      <button onclick="exportar()" class="bg-amber-500 hover:bg-amber-400 text-stone-950 font-extrabold px-6 py-3 rounded-xl">⬇️ Descargar data.js (para publicar)</button>
      <button onclick="reset()" class="bg-stone-800 hover:bg-stone-700 text-white font-bold px-6 py-3 rounded-xl">↺ Restaurar original</button>
    </div>
    <p id="msg" class="text-emerald-400 text-sm h-5"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
